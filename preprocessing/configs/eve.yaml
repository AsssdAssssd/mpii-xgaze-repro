paths:
  # EVE_dataset root (either .../EVE_dataset or .../EVE_dataset/eve_dataset)
  input_root: /home/zhongrui/datasets/EVE_dataset
  # null -> <parent of input_root>/<INPUT_ROOT uppercase>_normalized
  output_root: null
  face_model: configs/face_model/xgaze_face_model.txt
  landmark_predictor: modules/shape_predictor_68_face_landmarks.dat

filter:
  enable: true           # false -> ignore min_face / max_reproj
  min_face: 40           # drop faces with bbox min side < this (px)
  max_reproj: 8.0        # drop samples with PnP reprojection error > this (px)
  conf: 0.5              # MTCNN confidence threshold (detection is always run)
  skip_undistort: true   # EVE ships no distortion model; must stay true

options:
  save_landmarks: true   # write landmarks/<subj>.csv
  rotated_mesh_vis: False
  viz_per_subject: 0
  overwrite: false

runtime:
  subjects: ""           # comma list, empty = all train*/val*/test* dirs
  gpu_batch: 32
  print_freq: 200
  camera: basler         # basler | webcam_l | webcam_c | webcam_r
  frame_stride: 3        # basler is 60fps; 3 -> 20fps effective
  max_frames_per_step: 0 # 0 = all frames in a step
