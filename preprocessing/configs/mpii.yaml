paths:
  # <input_root>/<subj>/day*/*.jpg
  input_root: /home/zhongrui/datasets/MPIIFaceGaze
  # null -> <parent of input_root>/<INPUT_ROOT uppercase>_normalized
  output_root: null
  face_model: preprocessing/face_model/xgaze_face_model.txt
  landmark_predictor: modules/shape_predictor_68_face_landmarks.dat

filter:
  enable: true           # false -> ignore min_face 
  min_face: 40           # drop faces with bbox min side < this (px)
  skip_undistort: false  # ignore camera distortion in PnP

options:
  rotated_mesh_vis: False # write rotated_mesh_vis/<key>.txt
  viz_per_subject: 0     # montage tiles per subject, 0 = off
  overwrite: false       # recompute when output already exists

runtime:
  subjects: ""           # comma list, empty = p00..p14
  gpu_batch: 25
  print_freq: 50
